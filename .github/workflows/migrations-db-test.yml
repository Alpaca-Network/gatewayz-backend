name: Migrations DB Test

# Applies every migration to a throwaway Supabase Postgres and runs the SQL
# tests in tests/sql against it. Nothing here touches staging or production:
# no secrets, no `supabase link`. Runs on PRs to ANY base (stacked PRs too),
# so a migration is exercised before supabase-migrations.yml pushes it on main.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "tests/sql/**"
      - "src/services/job_usage*.py"
      - ".github/workflows/migrations-db-test.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/sql/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-db-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    name: Apply migrations + SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies the seed too, so supabase/seed.sql (local dev data) cannot rot
      # unnoticed again: it broke when users.credits was dropped (20260417000000).
      - name: Start local database (applies supabase/migrations + seed.sql)
        run: supabase db start

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "psycopg[binary]>=3.2,<4" pytest pytest-timeout

      - name: SQL tests
        env:
          GATEWAYZ_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        # -o addopts= drops pytest.ini's xdist/marker defaults: these tests share
        # one database and must run serially.
        run: python -m pytest tests/sql -o addopts= -v --timeout=120

      - name: Database logs on failure
        if: failure()
        run: docker logs "$(docker ps --filter name=supabase_db -q | head -1)" 2>&1 | tail -200 || true
