name: Lint & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy
          # Install project dependencies for type checking
          pip install -r requirements.txt || true

      - name: Run Ruff (Linter)
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check src/ tests/ --output-format=github
        continue-on-error: false

      - name: Run Black (Formatter Check)
        run: |
          echo "🎨 Checking code formatting with Black..."
          black src/ tests/ --check --line-length 100 --target-version py312
        continue-on-error: false

      - name: Run isort (Import Check)
        run: |
          echo "📦 Checking import sorting with isort..."
          isort src/ tests/ --check-only --profile black
        continue-on-error: false

      - name: Run MyPy (Type Checking)
        run: |
          echo "🔎 Running type checks with MyPy..."
          mypy src/ --ignore-missing-imports || echo "⚠️  Type checking warnings (not blocking)"
        continue-on-error: true  # Don't fail on type errors (warning only)

      - name: Summary
        if: success()
        run: |
          echo "✅ All linting checks passed!"
