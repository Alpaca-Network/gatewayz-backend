name: Other terminals on Gatewayz (OpenCode, Codex CLI)

# Live check that OpenCode and Codex CLI can use Gatewayz through the
# OpenAI-compatible /v1/chat/completions route: each reads a file and reports
# its content. Uses the GATEWAYZ_CONFORMANCE_KEY secret. Weekly, on demand, and
# when this file changes.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/other-terminals.yml"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.tool }} / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [opencode, codex]
        model: ["openai/gpt-5.4-mini", "moonshot/kimi-k2.6"]
    env:
      GATEWAYZ_API_KEY: ${{ secrets.GATEWAYZ_CONFORMANCE_KEY }}
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workspace
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          echo "alpha: the launch code is MAPLE-41" > "$RUNNER_TEMP/work/a.txt"

      - name: OpenCode
        if: matrix.tool == 'opencode'
        working-directory: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          npm install -g opencode-ai >/dev/null && opencode --version
          mkdir -p "$HOME/.config/opencode"
          node -e '
            const fs = require("fs");
            const cfg = {
              $schema: "https://opencode.ai/config.json",
              provider: { gatewayz: {
                npm: "@ai-sdk/openai-compatible",
                name: "Gatewayz",
                options: { baseURL: "https://api.gatewayz.ai/v1", apiKey: process.env.GATEWAYZ_API_KEY },
                models: { [process.env.MODEL]: {} },
              } },
            };
            fs.writeFileSync(process.env.HOME + "/.config/opencode/opencode.json", JSON.stringify(cfg));
          '
          timeout 600 opencode run -m "gatewayz/$MODEL" \
            "Read the file a.txt in the current folder and tell me the launch code." | tee out.txt
          grep -q "MAPLE-41" out.txt

      - name: Codex CLI
        if: matrix.tool == 'codex'
        working-directory: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          npm install -g @openai/codex >/dev/null && codex --version
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<TOML
          model = "$MODEL"
          model_provider = "gatewayz"

          [model_providers.gatewayz]
          name = "Gatewayz"
          base_url = "https://api.gatewayz.ai/v1"
          env_key = "GATEWAYZ_API_KEY"
          wire_api = "chat"
          TOML
          timeout 600 codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox \
            "Read the file a.txt in the current folder and tell me the launch code." 2>&1 | tee out.txt
          grep -q "MAPLE-41" out.txt
