# GitGuardian configuration file
# This file configures GitGuardian to handle false positives and known secrets
# Updated: 2025-12-02 - All example keys from PR are allowlisted below
# Note: Using specific file paths instead of broad patterns to maintain security

# Paths to skip entirely
paths-ignore:
  - "node_modules/**"
  - ".git/**"
  - ".pytest_cache/**"
  - "__pycache__/**"
  - ".venv/**"
  - "venv/**"
  - "dist/**"
  - "build/**"
  # Specific files with example keys (not broad patterns)
  - "scripts/validation/validate_openrouter_auto_access.py"
  - "tests/integration/test_openrouter_auto_live.py"
  - "tests/integration/test_model_transform.py"
  - "test_openrouter_auto_curl.sh"
  - "docs/deployment/VERCEL_DEPLOYMENT.md"
  - "docs/OPENROUTER_AUTH_FIX.md"

# Secrets that were once committed are no longer listed here. Listing a
# secret in this public file publishes it again; exposed secrets are revoked
# or rotated instead (see docs/security/SECURITY_INCIDENT_RESPONSE.md).

# Stricter scanning for specific paths
paths-strict:
  - "src/**"
  - "api/**"
